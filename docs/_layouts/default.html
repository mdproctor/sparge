<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body{% if page.layout == 'landing' %} class="has-hero"{% endif %}>
  <nav class="site-nav">
    <a class="nav-logo" href="{{ '/' | relative_url }}">
      <svg class="nav-logomark" width="24" height="24" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10,1 C10,1 4,13 4,18 A6,6 0 0,0 16,18 C16,13 10,1 10,1Z" fill="#7ab0cc"/>
        <path d="M24,0 C24,0 18,11 18,16 A6,6 0 0,0 30,16 C30,11 24,0 24,0Z" fill="#7ab0cc" opacity=".85"/>
        <path d="M38,1 C38,1 32,13 32,18 A6,6 0 0,0 44,18 C44,13 38,1 38,1Z" fill="#7ab0cc" opacity=".7"/>
        <rect x="1" y="27" width="46" height="3.5" rx="1.75" fill="#c8a96e"/>
        <rect x="1" y="33" width="46" height="3.5" rx="1.75" fill="#c8a96e" opacity=".65"/>
        <rect x="1" y="39" width="46" height="3.5" rx="1.75" fill="#c8a96e" opacity=".35"/>
      </svg>
      <span>Sparge</span>
    </a>
    <div class="nav-links">
      <a href="{{ '/user-guide/' | relative_url }}" class="nav-link{% if page.layout == 'doc' %} active{% endif %}">Docs</a>
      <a href="{{ '/blog/' | relative_url }}" class="nav-link{% if page.layout == 'post' or page.url contains '/blog/' %} active{% endif %}">Blog</a>
      <a href="https://github.com/mdproctor/sparge" class="nav-link" target="_blank" rel="noopener">GitHub &#x2197;</a>
    </div>
  </nav>
  {{ content }}
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-logo">
        <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:inline-block;vertical-align:middle;margin-right:6px">
          <path d="M10,1 C10,1 4,13 4,18 A6,6 0 0,0 16,18 C16,13 10,1 10,1Z" fill="#7ab0cc"/>
          <path d="M24,0 C24,0 18,11 18,16 A6,6 0 0,0 30,16 C30,11 24,0 24,0Z" fill="#7ab0cc" opacity=".85"/>
          <path d="M38,1 C38,1 32,13 32,18 A6,6 0 0,0 44,18 C44,13 38,1 38,1Z" fill="#7ab0cc" opacity=".7"/>
          <rect x="1" y="27" width="46" height="3.5" rx="1.75" fill="#c8a96e"/>
          <rect x="1" y="33" width="46" height="3.5" rx="1.75" fill="#c8a96e" opacity=".65"/>
          <rect x="1" y="39" width="46" height="3.5" rx="1.75" fill="#c8a96e" opacity=".35"/>
        </svg>Sparge
      </span>
      <div class="footer-links">
        <a href="{{ '/user-guide/' | relative_url }}">Docs</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="https://github.com/mdproctor/sparge" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/mdproctor/sparge/releases" target="_blank" rel="noopener">Download</a>
      </div>
      <span class="footer-tagline">Built with Sparge</span>
    </div>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el)));</script>
</body>
</html>
