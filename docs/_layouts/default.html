<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body{% if page.layout == 'landing' %} class="has-hero"{% endif %}>
  <nav class="site-nav">
    <a class="nav-logo" href="{{ '/' | relative_url }}">Sparge</a>
    <div class="nav-links">
      <a href="{{ '/user-guide/' | relative_url }}" class="nav-link{% if page.layout == 'doc' %} active{% endif %}">Docs</a>
      <a href="{{ '/blog/' | relative_url }}" class="nav-link{% if page.layout == 'post' or page.url contains '/blog/' %} active{% endif %}">Blog</a>
      <a href="https://github.com/mdproctor/sparge" class="nav-link" target="_blank" rel="noopener">GitHub &#x2197;</a>
    </div>
  </nav>
  {{ content }}
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-logo">Sparge</span>
      <div class="footer-links">
        <a href="{{ '/user-guide/' | relative_url }}">Docs</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="https://github.com/mdproctor/sparge" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/mdproctor/sparge/releases" target="_blank" rel="noopener">Download</a>
      </div>
      <span class="footer-tagline">Built with Sparge</span>
    </div>
  </footer>
</body>
</html>
